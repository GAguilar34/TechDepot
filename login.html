<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<div class="container"><!--incio de y contenedro del formulario-->
    <!--inicio del registro formulario-->
    <div id="form-registro">
        <h2>Crear Cuenta</h2> <!--encabezado de registro-->
        <form action="#" method="POST" id="formularioRegistro">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="form-group">
                <label for="Email">Correo electronico</label>
                <input type="text" id="Email" name="Email" placeholder="Ej. ejemplo@gmail.com" required>
            </div>
            <div class="grid-row">
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="text" id="edad" name="edad" placeholder="Ingresa tu edad" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu Contraseña" required>
                </div>
                <div class="form-group">
                    <label for="tipoUsuario">Tipo de usuario</label>
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="">Seleccione una opcion...</option>
                        <option value="cliente">Cliente</option>
                        <option value="vendedor">Vendedor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="genero">Genero</label>
                    <select id="genero" name="genero" required>
                        <option value="">Seleccione una opcion...</option>
                        <option value="hombre">Hombre</option>
                        <option value="mujer">Mujer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numeroCuenta">Numero de Cuenta</label>
                    <input type="password" id="numeroCuenta" name="numeroCuenta" placeholder="Ingresa numero de cuenta "
                        required>
                </div>
            </div>
        </form>
        <div class="tabs">
            <button id = "btnRegistro">Registrarse</button>
            <p>¿Aun no tienes una cuenta?</p>
            <button class="tab-btn active" onclick="toggleForms()">Iniciar Sesion</button>
        </div>

    </div>

    <div id="form-login" class="hidden">
        <h2>Inciar Sesion</h2>
        <form action="#" method="POST" id="formularioInicioSesion">
            <div class="form-group">
                <label for="Email">Correo electronico</label>
                <input type="text" id="Email" name="Email" placeholder="Ej. ejemplo@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="nombre">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <div class="tabs">
                <button id = "btnInicioSesion">Inciar Sesion</button>
                <p>¿Aun no tienes una cuenta?</p>
                <button id="tabRegistro" onclick="toggleForms()">Registrarse</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleForms() {
        const loginForm = document.getElementById('form-login');
        const registroForm = document.getElementById('form-registro');

        // Intercambiamos la clase hidden entre ambos
        loginForm.classList.toggle('hidden');
        registroForm.classList.toggle('hidden');
    }
</script>

</html>
