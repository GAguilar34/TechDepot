<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>
    <div class="container"><!--incio de y contenedro del formulario-->
        <!--inicio del registro formulario-->
        <div id="form-registro">
            <h2>Crear Cuenta</h2> <!--encabezado de registro-->
            <form action="#" method="POST" id="formularioRegistro">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="registroEmail">Correo electronico</label>
                    <input type="email" id="registroEmail" name="registroEmail" placeholder="Ej. ejemplo@gmail.com" required autocomplete="email">
                </div>
                <div class="grid-row">
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Ingresa tu edad" min="18" required autocomplete="off>
                    </div>
                    <div class="form-group">
                        <label for="registroPassword">Contrase&ntilde;a</label>
                        <input type="password" id="registroPassword" name="registroPassword" placeholder="Ingresa tu contrase&ntilde;a" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="tipoUsuario">Tipo de usuario</label>
                        <select id="tipoUsuario" name="tipoUsuario" required autocomplete="off">
                            <option value="">Seleccione una opcion...</option>
                            <option value="CLIENTE">Cliente</option>
                            <option value="VENDEDOR">Vendedor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="genero">Genero</label>
                        <select id="genero" name="genero" required autocomplete="off">
                            <option value="">Seleccione una opcion...</option>
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="text" id="telefono" name="telefono" placeholder="Ingresa tu telefono" minlength="10" maxlength="10" required autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="numeroCuenta">Numero de Cuenta</label>
                        <input type="text" id="numeroCuenta" name="numeroCuenta" placeholder="Solo vendedores" autocomplete="off">
                    </div>
                </div>
            </form>
            <div class="tabs">
                <button type="submit" form="formularioRegistro">Registrarse</button>
                <p>&iquest;Ya tienes una cuenta?</p>
                <button type="button" class="tab-btn active" onclick="toggleForms()">Iniciar Sesion</button>
            </div>
        </div>

        <div id="form-login" class="hidden">
            <h2>Iniciar Sesion</h2>
            <form action="#" method="POST" id="formularioInicioSesion">
                <div class="form-group">
                    <label for="loginEmail">Correo electronico</label>
                    <input type="email" id="loginEmail" name="Email" placeholder="Ej. ejemplo@gmail.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contrase&ntilde;a</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Ingresa tu contrase&ntilde;a" required autocomplete="current-password">
                </div>
                <div class="tabs">
                    <button type="submit">Iniciar Sesion</button>
                    <p>&iquest;Aun no tienes una cuenta?</p>
                    <button type="button" onclick="toggleForms()">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleForms() {
            const loginForm = document.getElementById('form-login');
            const registroForm = document.getElementById('form-registro');

            loginForm.classList.toggle('hidden');
            registroForm.classList.toggle('hidden');
        }
    </script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
